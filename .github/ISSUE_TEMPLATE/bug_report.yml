name: 🐛 Bug Report
description: Report a bug or unexpected behavior in the AIOD REST API
title: "[Bug]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug! Please fill out the form below to help us fix it quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the bug you encountered...
    validations:
      required: true

  - type: dropdown
    id: server
    attributes:
      label: Server Environment
      description: Which server were you connecting to?
      options:
        - api.aiod.eu (Production)
        - Staging/Test Server
        - Local Development
        - Other (specify in additional context)
    validations:
      required: true

  - type: input
    id: error-reference
    attributes:
      label: Error Reference Code
      description: If the server provided a reference code (hexadecimal string), please provide it
      placeholder: e.g., d47cb85f6cf64c158dbb65e1a891903f

  - type: dropdown
    id: api-version
    attributes:
      label: API Version
      description: Which version of the API are you using?
      options:
        - v1
        - v2
        - Latest/Main
        - Unknown
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: |
        Please provide a [minimal, reproducible example](https://stackoverflow.com/help/minimal-reproducible-example).
        Include complete queries, API calls, or code snippets that demonstrate the issue.
      placeholder: |
        1. Make a GET request to '/api/v1/...'
        2. With parameters: ...
        3. Observe error: ...
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: Describe the expected outcome...
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual Behavior
      description: What actually happened instead?
      placeholder: Describe what actually occurred...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity/Impact
      description: How severely does this bug affect your usage?
      options:
        - Critical - System unusable/data loss
        - High - Major functionality broken
        - Medium - Workaround available
        - Low - Minor inconvenience
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs/Error Messages
      description: Include any error messages, stack traces, or relevant log output
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: |
        Add any other context about the problem here:
        - Browser/client information
        - Authentication method used
        - Dataset/resource IDs involved
        - Screenshots
        - Related issues

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have provided all required information above
          required: true
        - label: I have included steps to reproduce the issue
          required: true
